name: Release

# Push a tag `v<version>` on main after the release commit: this checks that the tag,
# package.json and CHANGELOG.md agree, builds and packs the plugin, publishes the GitHub Release
# with the .tgz (a pre-release when the version has a `-` suffix), then publishes the same .tgz to
# npm. npm trusts this workflow (trusted publishing, set on the package's npm settings page), so
# there is no token; a pre-release goes to `next` once a release exists (scripts/release.ts npmTag).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run check
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
      - name: package contents
        run: node scripts/check-pack.mjs
      - name: version and CHANGELOG agree; release notes
        id: release
        run: echo "info=$(node scripts/release.ts "$GITHUB_REF_NAME" notes.md)" >> "$GITHUB_OUTPUT"
      - run: npm pack
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ fromJSON(steps.release.outputs.info).tarball }}
          PRERELEASE: ${{ fromJSON(steps.release.outputs.info).prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$TARBALL" --verify-tag --title "$TAG" --notes-file notes.md "${flags[@]}"
      - name: npm
        env:
          TARBALL: ${{ fromJSON(steps.release.outputs.info).tarball }}
          VERSION: ${{ fromJSON(steps.release.outputs.info).version }}
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          npm install -g npm@^11.5.1
          name=$(node -p "require('./package.json').name")
          published=$(npm view "$name" versions --json 2>/dev/null || true)
          tag=$(node scripts/release.ts --npm-tag "$VERSION" "$published")
          npm publish "$TARBALL" --access public --tag "$tag" --provenance
